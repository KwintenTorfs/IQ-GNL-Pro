name: Mirror GitHub to GitLab

on:
  push:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITLAB_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan gitlab.kuleuven.be >> ~/.ssh/known_hosts

      - name: Test SSH
        run: |
          ssh -T git@gitlab.kuleuven.be || true

      - name: Push to GitLab
        run: |
          git remote add gitlab git@gitlab.kuleuven.be:medphysqa/deploy/iq-gnl-pro.git
          git push gitlab --all
          git push gitlab --tags