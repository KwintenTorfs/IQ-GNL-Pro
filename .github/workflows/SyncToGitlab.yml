name: Mirror GitHub to GitLab

on:
  push:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to GitLab
        run: |
          git remote add gitlab https://${{ secrets.GITLAB_USERNAME }}:${{ secrets.GITLAB_PAT }}@gitlab.kuleuven.be/medphysqa/deploy/iq-gnl-pro.git
          git push gitlab --all
          git push gitlab --tags